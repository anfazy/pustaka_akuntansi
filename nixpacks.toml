# Configuration for Railway Deployment
providers = ["php"]

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer", "php83Extensions.gd", "php83Extensions.zip", "php83Extensions.intl", "php83Extensions.pdo_pgsql"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader --no-interaction --ignore-platform-req=ext-gd"]

[phases.build]
cmds = []
